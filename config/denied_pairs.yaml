# 负向表 —— 人工「驳回」过的实体对（判定为：不是同一实体）
#
# 定位：dedup 下一轮再算出同一对时**直接过滤**，不再进人工确认清单。
#   ⭐ 与 roster.yaml 的 aliases **对称**：
#       判定"是同一实体" → 写 roster 的 aliases（自动归并，不再问）
#       判定"不是同一实体" → 写本文件（直接过滤，不再问）
#   少了本文件，人会把同一对反复驳回一遍 —— 人工成本不收敛。
#
# 判定结果分为三类，去处不同：
#   合并 → roster.aliases
#   驳回 → 本文件（终态）
#   存疑 → 不进本文件；升级为"补证据/换人复核"，本轮不合并
#
# 健康指标：**每轮的人工确认清单长度应递减**。不降 = 沉淀没接上。
