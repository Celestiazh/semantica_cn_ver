# 参建单位名册 —— 消解的判定依据
#
# 定位：**管"这个字符串是什么"，不管"它们之间发生了什么"**
#   单位全称/别名/类型  → 名册（稳定、可枚举、需人工判断）
#   人姓名 + 单位       → 名册（作**消歧键**，区分同名不同人）
#   人→单位、人→会议、单位→项目 → **正文抽取**（正文带出处，且人会调单位）
#
# 用法：
#   - 命中 aliases → 直接归并到 name，**不进人工确认清单**
#   - 人工确认过的"是同一家" → 写进对应条目的 aliases（**名册靠这一步长大**）
#   - 每次跑完输出"不在名册的名字"清单 → 定期过一遍
#
# ⚠️ 当前状态：**自举候选，全称与别名待人工补全**
#    来源 = 19 份样本正文自举（单位[：:]人名 频次表）+ 真实重建图里的 ORG 实体。
# ⚠️ 签到表不可用作名册来源（手写，OCR 读不准）。
# ⚠️ 红线：名册为空时程序必须在输出里显式告知"未启用名册校验"。
